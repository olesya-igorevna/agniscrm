services:
  db:
    image: postgres:16-alpine
    container_name: agnis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agnis
      POSTGRES_PASSWORD: agnis
      POSTGRES_DB: agnis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agnis -d agnis"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: